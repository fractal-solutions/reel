<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1110" />
    <title>You're offline · FilamuReel</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; color: #e9e6dc; background: #0b1110; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; text-align: center; }
      main { max-width: 400px; padding: 32px; }
      .mark { display: grid; width: 150px; height: 150px; margin: 0 auto 24px; place-items: center; border: 2px solid #c7a86c; border-radius: 50%; background: #111a17; color: #e2c991; font: italic 500 48px Georgia, serif; }
      h1 { margin: 0 0 10px; font: 500 28px Georgia, serif; }
      p { color: #8d9690; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 11px 16px; border: 1px solid #c7a86c; color: #e2c991; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Reel</div>
      <h1>You're offline.</h1>
      <p>Connect to the internet to browse FilamuReel and stream your stories.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
